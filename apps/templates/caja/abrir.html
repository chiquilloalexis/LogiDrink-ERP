{% extends "base.html" %}

{% block title %}Abrir Caja | LogiDrink ERP{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white py-3">

                    <h4 class="fw-bold mb-1">
                        Abrir caja
                    </h4>

                    <p class="text-muted mb-0">
                        Registra el saldo inicial de la caja.
                    </p>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Nombre de la caja
                            </label>

                            <input
                                type="text"
                                name="nombre"
                                class="form-control"
                                value="Caja principal"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Saldo inicial
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    $
                                </span>

                                <input
                                    type="number"
                                    name="saldo_inicial"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                    value="0"
                                    required
                                >

                            </div>

                            <small class="text-muted">
                                Dinero disponible físicamente al iniciar la caja.
                            </small>

                        </div>


                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Observaciones
                            </label>

                            <textarea
                                name="observaciones"
                                class="form-control"
                                rows="3"
                                placeholder="Observaciones de la apertura..."
                            ></textarea>

                        </div>


                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('caja.index') }}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary">
                                Abrir caja
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
