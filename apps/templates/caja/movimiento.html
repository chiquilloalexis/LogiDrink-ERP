{% extends "base.html" %}

{% block title %}Movimiento de Caja | LogiDrink ERP{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white py-3">

                    <h4 class="fw-bold mb-1">
                        Movimiento de caja
                    </h4>

                    <p class="text-muted mb-0">
                        Caja:
                        <strong>{{ caja.nombre }}</strong>
                    </p>

                </div>

                <div class="card-body">

                    <div class="alert alert-info">

                        Saldo actual:

                        <strong>
                            ${{ "{:,.2f}".format(caja.saldo_actual or 0) }}
                        </strong>

                    </div>


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Tipo de movimiento
                            </label>

                            <select
                                name="tipo"
                                class="form-select"
                                required>

                                <option value="">
                                    Seleccionar...
                                </option>

                                <option value="ingreso">
                                    Ingreso
                                </option>

                                <option value="egreso">
                                    Egreso
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Concepto
                            </label>

                            <input
                                type="text"
                                name="concepto"
                                class="form-control"
                                placeholder="Ej: Venta, transporte, compra..."
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Valor
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    $
                                </span>

                                <input
                                    type="number"
                                    name="valor"
                                    class="form-control"
                                    min="0.01"
                                    step="0.01"
                                    required
                                >

                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Método de pago
                            </label>

                            <select
                                name="metodo_pago"
                                class="form-select">

                                <option value="Efectivo">
                                    Efectivo
                                </option>

                                <option value="Transferencia">
                                    Transferencia
                                </option>

                                <option value="Nequi">
                                    Nequi
                                </option>

                                <option value="Daviplata">
                                    Daviplata
                                </option>

                                <option value="Tarjeta">
                                    Tarjeta
                                </option>

                                <option value="Otro">
                                    Otro
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Referencia
                            </label>

                            <input
                                type="text"
                                name="referencia"
                                class="form-control"
                                placeholder="Número de referencia (opcional)"
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Descripción
                            </label>

                            <textarea
                                name="descripcion"
                                class="form-control"
                                rows="3"
                                placeholder="Detalles del movimiento..."
                            ></textarea>

                        </div>


                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('caja.index') }}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary">
                                Registrar movimiento
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
