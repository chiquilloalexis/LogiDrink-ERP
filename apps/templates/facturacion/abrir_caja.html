{% extends "base.html" %}

{% block title %}
Abrir Caja | LogiDrink ERP
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-dark text-white py-3">

                    <h4 class="mb-0">
                        <i class="bi bi-cash-stack me-2"></i>
                        Abrir Caja
                    </h4>

                </div>

                <div class="card-body p-4">

                    <div class="alert alert-info">

                        <strong>Antes de comenzar a vender</strong>

                        <br>

                        Ingresa el dinero en efectivo con el que
                        vas a iniciar la jornada.

                    </div>

                    <form
                        method="POST"
                        action="{{ url_for('facturacion.abrir_caja') }}"
                    >

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Nombre de la caja
                            </label>

                            <input
                                type="text"
                                name="nombre"
                                class="form-control"
                                value="Caja principal"
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Base inicial
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    $
                                </span>

                                <input
                                    type="number"
                                    name="saldo_inicial"
                                    class="form-control form-control-lg"
                                    min="0"
                                    step="0.01"
                                    placeholder="Ej: 100000"
                                    required
                                    autofocus
                                >

                            </div>

                            <small class="text-muted">
                                Este es el efectivo que tienes físicamente
                                al comenzar la jornada.
                            </small>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Observaciones
                            </label>

                            <textarea
                                name="observaciones"
                                class="form-control"
                                rows="3"
                                placeholder="Opcional"
                            ></textarea>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success btn-lg w-100"
                        >

                            <i class="bi bi-unlock-fill me-2"></i>

                            Abrir Caja

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
